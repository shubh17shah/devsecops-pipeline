name: ci

# Pipeline: unit tests -> SAST -> multi-stage Docker build -> Trivy scan
# (blocking) -> SBOM + Cosign keyless signing -> push to GHCR -> GitOps
# image-tag bump + ArgoCD-driven staging rollout + smoke tests -> manual
# prod approval -> automatic rollback on failure. Each stage is a job wired
# with `needs:` so the DAG below is enforced by GitHub Actions itself, not
# just documentation.
#
# app/ is telemetry-service, the Node.js/Express service also vendored
# into shubh17shah/eks-platform (apps/telemetry-service) where it backs
# all 12 of that platform's microservice Applications off one shared
# image. This repo is that image's build/test/scan/sign/push pipeline;
# eks-platform is the GitOps repo the `deploy-*` jobs below push the
# resulting image tag into. See README.md for the full loop diagram.
#
# Required repository configuration (see README.md "Configuration" and
# docs/VAULT.md) — documented there as required values, same as any other
# CI pipeline's setup requirements:
#   Variables (Settings > Secrets and variables > Actions > Variables):
#     SONAR_ORGANIZATION, SONAR_PROJECT_KEY, GITOPS_REPO, ARGOCD_SERVER,
#     ARGOCD_APPS, STAGING_URL, PROD_URL
#   Secrets:
#     SONAR_TOKEN, GITOPS_REPO_TOKEN, ARGOCD_AUTH_TOKEN
# GHCR push and Cosign's Sigstore Fulcio step both authenticate via
# GitHub's own OIDC token (permissions.id-token: write / packages: write)
# — no registry credentials to provision for the default path. See the
# `sign` job for the commented AWS OIDC/ECR alternative for when this
# pipeline targets a live EKS cluster instead of (or in addition to) GHCR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job below opts back in to only the
# scopes it actually needs.
permissions: {}

env:
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION_FILE: app/package.json
  # ghcr.io/shubh17shah/telemetry-service — matches the `image.repository`
  # eks-platform's charts/microservice/values.yaml already pulls, so a tag
  # pushed here is immediately deployable there with no chart change.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telemetry-service

jobs:
  # ---------------------------------------------------------------------
  # 1. Unit tests
  # ---------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        # No package-lock.json is committed yet (see app/README.md "Local
        # `npm ci` installs strictly from the committed lockfile and fails
        # if it has drifted from package.json — reproducible by construction.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: node --test test/

  # ---------------------------------------------------------------------
  # 2. SAST: SonarCloud, with a Semgrep fallback that needs no secrets
  # ---------------------------------------------------------------------
  sast:
    name: sast
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload Semgrep's SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # SonarCloud wants full history for blame/new-code

      - name: SonarCloud scan
        id: sonarcloud
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        # SONAR_TOKEN isn't available on PRs from forks, and a SonarCloud
        # org may not be wired up for every fork of this repo — don't let
        # a missing/invalid token take the whole pipeline down. Semgrep
        # below is the always-on safety net for exactly that case.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Semgrep SAST (fallback / defense-in-depth)
        if: always()
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan \
            --config auto \
            --config p/nodejsscan \
            --config p/expressjs \
            --sarif --output semgrep-results.sarif \
            --error \
            app/

      - name: Upload Semgrep SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Fail if both SAST tools were unavailable
        if: steps.sonarcloud.outcome == 'failure'
        run: |
          echo "::warning::SonarCloud step failed or SONAR_TOKEN is not configured. Relying on Semgrep results for this run — see README.md 'Configuration' for how to wire up SonarCloud."

  # ---------------------------------------------------------------------
  # 3. Multi-stage Docker build (no registry push yet)
  # ---------------------------------------------------------------------
  build:
    name: build
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image (loaded into the local daemon, not pushed)
        uses: docker/build-push-action@v7.4.0
        with:
          context: app
          file: app/Dockerfile
          push: false
          load: true
          tags: telemetry-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as an OCI tarball
        run: |
          mkdir -p dist
          docker save telemetry-service:${{ env.IMAGE_TAG }} | gzip > dist/image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image
          path: dist/image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------
  # 4. Trivy scan — blocks the pipeline on HIGH/CRITICAL
  # ---------------------------------------------------------------------
  scan:
    name: scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload the full SARIF report
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-image
          path: dist

      - name: Load image into Docker daemon
        run: docker load < dist/image.tar.gz

      # Full, non-blocking report first so the Security tab always gets
      # populated, even if (especially if!) the run is about to fail the
      # gate below on the same findings.
      - name: Trivy full report (non-blocking, SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telemetry-service:${{ env.IMAGE_TAG }}
          scan-type: image
          format: sarif
          output: trivy-full-report.sarif
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: trivy-full-report.sarif
          category: trivy-image

      # The actual gate. HIGH/CRITICAL with a known fix fails the build.
      # ignore-unfixed is deliberate: failing on a CVE with no available
      # patch just trains everyone to click "re-run" — see
      # docs/SECURITY-GATES.md for a scheduled run that verifies this gate
      # actually stops a bad image, not just that the step exists.
      - name: Trivy vulnerability gate (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telemetry-service:${{ env.IMAGE_TAG }}
          scan-type: image
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  # ---------------------------------------------------------------------
  # 5. SBOM + keyless signing
  #
  # NOTE on ordering: a Cosign keyless signature is an OCI artifact stored
  # *in the registry* next to the image it covers, so the image has to
  # exist in GHCR before Cosign can sign it. This job performs that push —
  # it is the same "push to GHCR" the pipeline description and job DAG
  # refer to, not a separate copy. The downstream `push` job re-authenticates
  # independently and is what actually decides the image is releasable: it
  # verifies the signature/attestation Cosign just produced and promotes
  # the moving tag that deploy-staging reads.
  # ---------------------------------------------------------------------
  sign:
    name: sign
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for Sigstore Fulcio (keyless signing)
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-image
          path: dist

      - name: Load image into Docker daemon
        run: docker load < dist/image.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- AWS OIDC / ECR alternative (commented) ---------------------
      # Kept here, not deleted, for when this pipeline targets a live EKS
      # cluster pulling from a private ECR repository instead of (or
      # alongside) GHCR's public pulls. No long-lived AWS keys either way
      # — the role is assumed via GitHub's OIDC token.
      #
      # - name: Configure AWS credentials via OIDC
      #   uses: aws-actions/configure-aws-credentials@v6.3.0
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      #     role-session-name: gha-devsecops-pipeline-sign
      #
      # - name: Login to Amazon ECR
      #   id: ecr-login
      #   uses: aws-actions/amazon-ecr-login@v2.1.7
      #
      # - name: Tag and push to ECR instead of/alongside GHCR
      #   run: |
      #     DEST="${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
      #     docker tag "telemetry-service:${IMAGE_TAG}" "$DEST"
      #     docker push "$DEST"
      # ------------------------------------------------------------------

      - name: Tag and push immutable image
        id: push-image
        run: |
          set -euo pipefail
          SRC="telemetry-service:${IMAGE_TAG}"
          DEST="${IMAGE_NAME}:${IMAGE_TAG}"
          docker tag "$SRC" "$DEST"
          docker push "$DEST"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DEST")
          echo "image=$DEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ steps.push-image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ env.IMAGE_TAG }}.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Cosign keyless sign
        run: cosign sign --yes "${{ steps.push-image.outputs.digest }}"

      - name: Attach SBOM as a signed attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.push-image.outputs.digest }}"
    outputs:
      image_digest: ${{ steps.push-image.outputs.digest }}

  # ---------------------------------------------------------------------
  # 6. Push / promote: verify the signature, move the release pointer
  # ---------------------------------------------------------------------
  push:
    name: push
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Verify signature was produced by this workflow
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.sign.outputs.image_digest }}"

      - name: Promote moving tag (stable)
        run: |
          set -euo pipefail
          docker pull "${{ needs.sign.outputs.image_digest }}"
          STABLE="${IMAGE_NAME}:stable"
          docker tag "${{ needs.sign.outputs.image_digest }}" "$STABLE"
          docker push "$STABLE"
    outputs:
      image: ${{ needs.sign.outputs.image_digest }}

  # ---------------------------------------------------------------------
  # 7. Deploy to staging: bump the image tag in the GitOps repo, let
  #    ArgoCD's own automated sync/self-heal pick it up, then smoke test.
  #
  #    eks-platform (the GitOps repo, vars.GITOPS_REPO) runs one EKS
  #    cluster: all 12 of its microservice Applications are Helm releases
  #    of the same charts/microservice chart, and that chart's single
  #    `image.tag` field (charts/microservice/values.yaml) is shared
  #    fleet-wide — there is no separate environments/staging vs
  #    environments/production overlay to target (eks-platform's own
  #    values files under charts/values/ only override per-service
  #    identity and scaling, never the image). So "staging" here is the
  #    automated half of the promotion: this job bumps that one field,
  #    pushes to eks-platform's `main` (the only branch its Applications'
  #    `targetRevision` watches), and relies on the `syncPolicy.automated`
  #    (prune + selfHeal) already set on every Application in
  #    argocd/apps/ to pick the change up on its own. The explicit
  #    `argocd app sync`/`wait` below turns that into a deterministic gate
  #    this workflow can block on, instead of guessing how long
  #    auto-sync's poll interval takes.
  # ---------------------------------------------------------------------
  deploy-staging:
    name: deploy-staging
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout (for smoke-tests/)
        uses: actions/checkout@v7.0.1

      - name: Checkout GitOps repo (shubh17shah/eks-platform)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Record current image tag (for rollback)
        id: previous
        working-directory: gitops
        run: |
          CURRENT=$(yq '.image.tag' charts/microservice/values.yaml)
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "$CURRENT" > previous-tag.txt

      - name: Upload previous tag artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: previous-image-tag
          path: gitops/previous-tag.txt
          retention-days: 5

      - name: Bump image.tag in charts/microservice/values.yaml
        working-directory: gitops
        run: |
          set -euo pipefail
          FILE="charts/microservice/values.yaml"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): telemetry-service@${IMAGE_TAG}"
          git push

      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync and wait for ArgoCD health
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # vars.ARGOCD_APPS: space-separated ArgoCD Application names to
          # gate on, e.g. "telemetry-ingest telemetry-query" — the two
          # Applications in argocd/apps/ that are this service under its
          # own name. The other 10 Applications sharing this image tag
          # update via the same automated selfHeal independently of this
          # workflow; these two are what this repo's own smoke tests below
          # exercise directly.
          for app in ${{ vars.ARGOCD_APPS }}; do
            argocd app sync "$app" --server "${{ vars.ARGOCD_SERVER }}" --grpc-web
            argocd app wait "$app" --server "${{ vars.ARGOCD_SERVER }}" --grpc-web \
              --health --timeout 300
          done

      - name: Smoke test staging
        env:
          SMOKE_TEST_URL: ${{ vars.STAGING_URL }}
        run: ./smoke-tests/smoke-test.sh

  # ---------------------------------------------------------------------
  # 8. Production sign-off — gated behind manual approval
  #
  #    There is no second cluster/values file to bump here (see the
  #    deploy-staging comment above): the image this job confirms is the
  #    same release deploy-staging already put on the one EKS cluster.
  #    This job is the human checkpoint on top of it — a required reviewer
  #    on the `production` GitHub Environment signs off, then this job
  #    independently re-verifies ArgoCD health and runs a second smoke
  #    test against vars.PROD_URL before the release is considered
  #    "in production", consistent with eks-platform's own documented
  #    single-cluster, cost-constrained design (see that repo's
  #    charts/microservice/values.yaml comments on its node group size).
  # ---------------------------------------------------------------------
  deploy-prod:
    name: deploy-prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # required reviewers configured in repo settings
    permissions:
      contents: read
    steps:
      - name: Checkout (for smoke-tests/)
        uses: actions/checkout@v7.0.1

      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Re-verify ArgoCD health post-approval
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for app in ${{ vars.ARGOCD_APPS }}; do
            argocd app wait "$app" --server "${{ vars.ARGOCD_SERVER }}" --grpc-web \
              --health --timeout 300
          done

      - name: Post-deploy health check
        env:
          SMOKE_TEST_URL: ${{ vars.PROD_URL }}
        run: ./smoke-tests/smoke-test.sh

  # ---------------------------------------------------------------------
  # 9. Automatic rollback if the production health check fails
  # ---------------------------------------------------------------------
  rollback:
    name: rollback
    needs: deploy-prod
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout GitOps repo (shubh17shah/eks-platform)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Download previous tag artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: previous-image-tag
          path: previous

      - name: Revert image.tag in charts/microservice/values.yaml
        working-directory: gitops
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(cat ../previous/previous-tag.txt)
          FILE="charts/microservice/values.yaml"
          yq -i ".image.tag = \"${PREVIOUS_TAG}\"" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "rollback: revert telemetry-service to ${PREVIOUS_TAG} after failed health check on ${IMAGE_TAG}"
          git push

      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Sync and wait for ArgoCD health
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          for app in ${{ vars.ARGOCD_APPS }}; do
            argocd app sync "$app" --server "${{ vars.ARGOCD_SERVER }}" --grpc-web
            argocd app wait "$app" --server "${{ vars.ARGOCD_SERVER }}" --grpc-web \
              --health --timeout 300
          done

      - name: Confirm rollback is healthy
        env:
          SMOKE_TEST_URL: ${{ vars.PROD_URL }}
        run: ./smoke-tests/smoke-test.sh

      - name: Summary
        if: always()
        run: |
          echo "### :leftwards_arrow_with_hook: Production rollback triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed release: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
